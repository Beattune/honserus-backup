#####################################################################
#   MCU
#####################################################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_0D0016000C51313339373836-if00
restart_method: command

#####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
heater_pin: PA0
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 1.0
min_temp: 0
max_temp: 120
control: pid
pid_kp: 29.760
pid_ki: 0.702
pid_kd: 315.576

#####################################################################
#   Chamber Heater
#####################################################################
[heater_generic heater_chamber]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF4
max_power: 1.0
min_temp: 0
max_temp: 150
smooth_time: 3.0
pwm_cycle_time: 0.300
control: pid_v
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

[verify_heater heater_chamber]
max_error: 600
check_gain_time: 900
hysteresis: 15
heating_gain: 1

#####################################################################
#   Extruder
#####################################################################
[extruder]
step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
rotation_distance: 22.452
gear_ratio: 50:8
microsteps: 64
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PA1
sensor_type: Dyze500
sensor_pin: PF7
min_temp: 10
max_temp: 450
max_power: 1.0
min_extrude_temp: 200
#max_extrude_only_velocity: 200
#max_extrude_only_accel: 15000
#max_extrude_only_distance: 101
#max_extrude_cross_section: 5
pressure_advance: 0.02
pressure_advance_smooth_time: 0.020
control: mpc
heater_power: 120  
cooling_fan: cpap_flap
filament_density: 1.20
filament_heat_capacity: 1.8 

[thermistor Dyze500]
temperature1: 25
resistance1: 4500000
temperature2: 260
resistance2: 2240
temperature3: 460
resistance3: 125.4

#####################################################################
#   Fans
#####################################################################
[heater_fan chamber_heater_fan]
pin: PD13
fan_speed: 0.75
shutdown_speed: 1.0
heater: heater_chamber
heater_temp: 50

# PCF: WS7040 blower
[fan]
pin: PG12
max_power: 0.6
cycle_time: 0.002
hardware_pwm: false
shutdown_speed: 0

# CPAP Flap
[servo cpap_flap]
pin: PB6
maximum_servo_angle: 80
minimum_pulse_width: 0.0010
maximum_pulse_width: 0.0019
initial_angle: 64

## HEF
[heater_fan hotend_fan]
pin: PA8
heater_temp: 50

#####################################################################
#   LED Control
#####################################################################
[output_pin caselight]
pin: PB0
pwm: true
shutdown_value: 1
value: 1.0
cycle_time: 0.01

#####################################################################
#   Temperature Sensors
#####################################################################
[temperature_sensor octopus_pro]
sensor_type: temperature_mcu
sensor_mcu: mcu

# Virtual pin chip (klipper-virtual-pins). Must stay ABOVE every section that
# uses a virtual_pin: (this file is included before cpap_flap.cfg).
[virtual_pins]

# Chamber air (BME280) as a FAKE heater: its target is the chamber goal set in
# the UI / M141 / M191. The pin is virtual - nothing is driven. The real PTC
# heater is [heater_generic heater_chamber], driven by chamber_heater_control
# in macros/chamber_heater.cfg.
[heater_generic chamber]
heater_pin: virtual_pin:chamber_dummy
sensor_type: BME280
i2c_address: 119      # 0x77
i2c_software_scl_pin: PB8
i2c_software_sda_pin: PB9
control: watermark
min_temp: -10
max_temp: 90

# Fake heater never heats by itself; hysteresis above max_temp means the
# verify error never accumulates. The PTC keeps its own [verify_heater heater_chamber].
[verify_heater chamber]
hysteresis: 150

[temperature_sensor stepper_rear]
sensor_type: Generic 3950
sensor_pin: PF6