[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_3C0017000F5030514B343620-if00
restart_method: command
is_non_critical: true

[cartographer]
mcu: cartographer
x_offset: 0 
y_offset: 24.17
verbose: no

[cartographer touch]
UNSAFE_max_touch_temperature: 155

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 120

[adxl345 carto]
cs_pin: cartographer:PA0
spi_bus: spi1
axes_map: y, -x, z

[bed_mesh]
zero_reference_position: 174.5, 175
speed: 300
mesh_min: 20, 25
mesh_max: 330, 320
probe_count: 20, 20
mesh_pps: 0,0

#BE-TEST# [axis_twist_compensation]
#BE-TEST# reference_probe: cartographer_touch
#BE-TEST# mesh_min: 20, 30
#BE-TEST# mesh_max: 330, 300
#BE-TEST# probe_count: 5, 5
#BE-TEST# algorithm: bicubic
#BE-TEST# horizontal_move_z: 5
