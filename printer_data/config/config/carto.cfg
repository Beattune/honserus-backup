[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_3C0017000F5030514B343620-if00
restart_method: command
is_non_critical: true

[cartographer]
mcu: cartographer
x_offset: 0 
y_offset: 24.17
verbose: no

#[cartographer touch]
#UNSAFE_max_touch_temperature: 300

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 120

[adxl345 carto]
cs_pin: cartographer:PA0
spi_bus: spi1
axes_map: y, -x, z

[bed_mesh]
zero_reference_position: 174.0, 164.5
speed: 300
mesh_min: 31.75, 56.7
mesh_max: 321.75, 318.7
probe_count: 20, 20
mesh_pps: 0,0

[axis_twist_compensation]
calibrate_start_x: 39.75
calibrate_end_x: 314.75
calibrate_y: 196.2