#   ---- Flap mode (plugin ~/klipper/klippy/plugins/cpap_flap.py) ----
#   PRINT_START runs _CPAP_MODE ACTIVE=0 (safety) first and _CPAP_MODE
#   ACTIVE=1 after the purge: the blower then runs constant at [fan]
#   max_power and every M106/M107 only moves the flap. No CPAP_SCAN.
#   PRINT_END and CANCEL_PRINT (Mainsail user_cancel_macro) run
#   _CPAP_MODE ACTIVE=0.
#   Direct mapping: flap toolhead share = S/255 (M106 S255 = all air to the
#   toolhead, M107 = all air into the chamber). Outside flap mode, M106 is
#   the plain Kalico command (PWM = S/255 * max_power).
[cpap_flap]
#   blower constant at max_power, MPC_CALIBRATE steps the flap (fork beattune-core/cpap-flap)
mpc_blower: constant
#   also MPC's cooling fan: [extruder] cooling_fan: cpap_flap
#   (reports blower PWM power * flap toolhead share as "speed")
#timeout: 60
#fan: fan
#servo: cpap_flap

[gcode_macro _CPAP_MODE]
description: Flap mode. ACTIVE=1 blower constant at printer.cpap_flap.fan_max (CPAP_SCAN first), M106/M107 only move the flap. ACTIVE=0 normal fan, flap to idle_flap % toolhead (override: FLAP=<0-100>)
variable_active: False
variable_blower: 0.0
#   flap position outside flap mode, % toolhead (rest goes to the chamber)
variable_idle_flap: 20
gcode:
    {% if params.ACTIVE|default(0)|int == 1 %}
        # blower constant at [fan] max_power (M106 S255 = full value = max_power)
        {% set blower = (printer.configfile.settings.fan.max_power or 1.0)|float %}
        SET_GCODE_VARIABLE MACRO=_CPAP_MODE VARIABLE=blower VALUE={blower}
        SET_GCODE_VARIABLE MACRO=_CPAP_MODE VARIABLE=active VALUE=True
        CPAP_FLAP PERCENT=0
        M106.1 S255
        RESPOND MSG="CPAP flap mode ON: blower constant at max_power {'%.0f' % (blower * 100)} %, flap 0 % until the first M106"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CPAP_MODE VARIABLE=active VALUE=False
        SET_GCODE_VARIABLE MACRO=_CPAP_MODE VARIABLE=blower VALUE=0.0
        {% set flap = [[params.FLAP|default(idle_flap)|float, 0.0]|max, 100.0]|min %}
        M107.1
        CPAP_FLAP PERCENT={'%.1f' % flap}
        RESPOND MSG="CPAP flap mode OFF: blower off, flap {'%.1f' % flap} % toolhead"
    {% endif %}

[gcode_macro M106]
rename_existing: M106.1
description: Part fan. Flap mode: only moves the flap (toolhead share = S/255 / blower power), otherwise the normal M106
gcode:
    {% set mode = printer["gcode_macro _CPAP_MODE"] %}
    {% if not mode.active %}
        M106.1 {rawparams}
    {% elif params.P|default(0)|int == 0 %}
        # M106 P1/P2/P3 (aux/exhaust fans) are ignored in flap mode, like in CPAP_SCAN
        {% set wanted = [[params.S|default(255)|float / 255, 0.0]|max, 1.0]|min %}
        # direct mapping: slicer fan % = share of the blower air to the toolhead
        {% set pct = wanted * 100 %}
        CPAP_FLAP PERCENT={'%.1f' % pct}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
description: Part fan off. Flap mode: flap to 0 % toolhead (blower keeps running), otherwise the normal M107
gcode:
    {% if printer["gcode_macro _CPAP_MODE"].active %}
        M106 S0
    {% else %}
        M107.1
    {% endif %}

#   MPC calibration of the extruder with blower + flap prepared. Refuses up
#   front in flap mode or during a print (otherwise the plugin would only
#   refuse after minutes of heating). Extra parameters go to MPC_CALIBRATE,
#   default FAN_BREAKPOINTS=11. Works with cooling_fan: fan and cpap_flap.
#   If MPC_CALIBRATE fails or is aborted, this macro stops too: run
#   _CPAP_MPC_END by hand (fan off, flap 100 %),
#   MPC itself already sets the hotend target to 0.
[gcode_macro CPAP_MPC_CALIBRATE]
description: MPC_CALIBRATE HEATER=extruder with flap mode off, part fan off, flap 100 %. Default FAN_BREAKPOINTS=11
gcode:
    {% if printer["gcode_macro _CPAP_MODE"].active %}
        { action_raise_error("CPAP_MPC_CALIBRATE: flap mode is active - run _CPAP_MODE ACTIVE=0 first") }
    {% endif %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("CPAP_MPC_CALIBRATE: not while a print is " ~ printer.print_stats.state) }
    {% endif %}
    {% if params.HEATER|default("extruder")|lower != "extruder" %}
        { action_raise_error("CPAP_MPC_CALIBRATE: only for HEATER=extruder - use MPC_CALIBRATE for other heaters") }
    {% endif %}
    {% set args = [] %}
    {% for key in params %}
        {% if key != "HEATER" %}
            {% set dummy = args.append("%s=%s" % (key, params[key])) %}
        {% endif %}
    {% endfor %}
    {% if "FAN_BREAKPOINTS" not in params %}
        {% set dummy = args.append("FAN_BREAKPOINTS=11") %}
    {% endif %}
    M107
    CPAP_FLAP PERCENT=100
    RESPOND MSG="CPAP_MPC_CALIBRATE: fan off, flap 100 % - MPC_CALIBRATE HEATER=extruder {args|join(' ')}"
    MPC_CALIBRATE HEATER=extruder {args|join(' ')}
    _CPAP_MPC_END
    RESPOND MSG="CPAP_MPC_CALIBRATE done - check the values above, then SAVE_CONFIG"

[gcode_macro _CPAP_MPC_END]
description: After CPAP_MPC_CALIBRATE (run by hand after an aborted calibration): part fan off, flap 100 %
gcode:
    M107
    CPAP_FLAP PERCENT=100
    RESPOND MSG="CPAP: part fan off, flap 100 %"

#   Servo is [servo cpap_flap] in octopus.cfg. ANGLE 0 = min pulse = 100 % toolhead.
#   Scaled to the servo's maximum_servo_angle (not fixed to 100 as in the upstream README).
[gcode_macro CPAP_FLAP]
description: Toolhead share of the CPAP air. CPAP_FLAP PERCENT=0-100 (100 = all air to toolhead)
gcode:
    {% set pct = [[params.PERCENT|default(100)|float, 0.0]|max, 100.0]|min %}
    {% set max_angle = printer.configfile.settings["servo cpap_flap"].maximum_servo_angle|float %}
    SET_SERVO SERVO=cpap_flap ANGLE={'%.2f' % ((100 - pct) * max_angle / 100)}
    # Mainsail readout (_SET_PIN_BASE = the real command, SET_PIN would loop back here)
    _SET_PIN_BASE PIN=cpap_flap_pos VALUE={'%.1f' % pct}

#   ---- Flap readout in Mainsail ----
#   Mainsail has no servo widget, so the flap toolhead share is mirrored on a
#   dummy PWM pin that Mainsail shows as a slider "Cpap Flap Pos" (0-100 %).
#   PB7 = BLTouch header signal pin, nothing connected; the pin does nothing.
#   Dragging the slider moves the flap (SET_PIN wrapper below). During flap
#   mode the next M106/M107 overrides it, like the part-fan slider.
[output_pin cpap_flap_pos]
pin: PB7
pwm: true
scale: 100
value: 0
shutdown_value: 0

[gcode_macro SET_PIN]
rename_existing: _SET_PIN_BASE
description: SET_PIN. PIN=cpap_flap_pos moves the CPAP flap (VALUE = % toolhead), all other pins unchanged
gcode:
    {% if params.PIN|default("")|lower == "cpap_flap_pos" %}
        CPAP_FLAP PERCENT={params.VALUE|default(0)|float}
    {% else %}
        _SET_PIN_BASE {rawparams}
    {% endif %}

#   readout = servo initial_angle after a Klipper start (servo is not moved)
[delayed_gcode _CPAP_FLAP_POS_INIT]
initial_duration: 1
gcode:
    {% set s = printer.configfile.settings["servo cpap_flap"] %}
    {% set pct = 100 - (s.initial_angle|default(0)|float) * 100 / s.maximum_servo_angle|float %}
    _SET_PIN_BASE PIN=cpap_flap_pos VALUE={'%.1f' % ([[pct, 0.0]|max, 100.0]|min)}
