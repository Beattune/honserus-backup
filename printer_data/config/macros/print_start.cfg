[gcode_macro PRINT_START]
gcode:
  # CPAP: flap mode off (safety reset: blower off, flap 100 % toolhead)
  _CPAP_MODE ACTIVE=0
  
  # Reset & Home
  PRINT_START_RESET_HOME
  
  # Heatsoak
  PRINT_START_HEATSOAK
  
  # Motor Sync
  PRINT_START_MSYNC
  
  # Leveling
  Z_TILT_ADJUST
  
  # Cartographer Touch
  PRINT_START_CARTO_TOUCH
  
  # Bed Mesh
  PRINT_START_BED_MESH
  
  # Heat up Hotend
  PRINT_START_HEAT_HOTEND
  
  # Skew correction
  SKEW_PROFILE LOAD=Calilantern
  
  # Line purge
  SQUIGGLY_PURGE
  
  # CPAP: blower constant at [fan] max_power, M106/M107 only move the flap
  _CPAP_MODE ACTIVE=1
  
  # Set Display Text
  SET_DISPLAY_TEXT MSG="Honserus goes brr" 