# G28 override: after homing X and/or Y, run SYNC_MOTORS if the XY motors
# are not synced yet. motors_sync.applied is cleared on every motor-off
# (M84, idle timeout) and set by a successful SYNC_MOTORS.
# "G28 Z" alone (e.g. in the BED_MESH_CALIBRATE override) never syncs.

[gcode_macro G28]
rename_existing: G28.1
description: Home, then SYNC_MOTORS if XY homed and motors not synced
gcode:
  G28.1 {rawparams}
  {% set p = params|list %}
  {% if not ("X" in p or "Y" in p or "Z" in p) or "X" in p or "Y" in p %}
    _G28_MSYNC
  {% endif %}

# Separate macro so motors_sync.applied and homed_axes are read AFTER homing
# (a macro template is rendered before any of its commands run).
[gcode_macro _G28_MSYNC]
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% if "x" in homed and "y" in homed and not printer.motors_sync.applied %}
    RESPOND MSG="G28: motors not synced, running SYNC_MOTORS"
    SYNC_MOTORS
  {% endif %}

# SYNC_MOTORS homes X/Y by itself (G28 x y) when they are not homed. That
# would re-enter the G28 macro above and start a second, nested sync.
# Home natively first so the plugin never calls G28. RESTORE_SYNC (boot
# delayed_gcode) only re-applies the phase offset and must not home.
[gcode_macro SYNC_MOTORS]
rename_existing: _SYNC_MOTORS_BASE
description: motors_sync with native XY pre-homing (avoids G28 macro recursion)
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% if "RESTORE_SYNC" not in params and ("x" not in homed or "y" not in homed) %}
    G28.1 X Y
  {% endif %}
  _SYNC_MOTORS_BASE {rawparams}
