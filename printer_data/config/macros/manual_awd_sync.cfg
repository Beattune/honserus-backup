# CoreXY AWD baseline for motors_sync.
# 1. Loosen the grub screws of the FRONT motor pulleys (stepper_x1, stepper_y1).
# 2. AWD_SYNC: re-applies the last motors_sync phase offset, homes X/Y natively
#    (G28.1, so the G28 wrapper does not auto-run SYNC_MOTORS with loose
#    pulleys), then runs full-travel X, Y and 45° diagonal moves so the belt
#    tension equalizes over all idlers (each diagonal runs only one belt).
#    Small wiggles are NOT enough: they leave uneven belt tension that later
#    pulls the front motor out of phase. Ends at the center, motors holding.
# 3. Tighten the front pulleys while the motors hold (idle_timeout: 30 min).
# 4. G28, then SYNC_MOTORS: it starts from this mechanical baseline and saves
#    the result as the offset restored after every boot.
# Do not power cycle or restart Klipper between 2. and 4.
[gcode_macro AWD_SYNC]
description: CoreXY AWD baseline. Loosen the FRONT motor pulleys first, tighten them when the macro is done, then G28 + SYNC_MOTORS
gcode:
    {% set passes = params.PASSES|default(3)|int %}
    {% set margin = params.MARGIN|default(30)|float %}
    {% set f = params.F|default(6000)|int %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("AWD_SYNC: not while a print is " ~ printer.print_stats.state) }
    {% endif %}
    {% set mn = printer.toolhead.axis_minimum %}
    {% set mx = printer.toolhead.axis_maximum %}
    {% set x0 = mn.x + margin %}
    {% set x1 = mx.x - margin %}
    {% set y0 = mn.y + margin %}
    {% set y1 = mx.y - margin %}
    {% set cx = (x0 + x1) / 2 %}
    {% set cy = (y0 + y1) / 2 %}
    {% set d = [x1 - cx, y1 - cy]|min %}
    SYNC_MOTORS RESTORE_SYNC=1
    # Native homing: the G28 wrapper would auto-run SYNC_MOTORS with loose pulleys
    G28.1 X Y
    G90
    {% for i in range(passes) %}
        G1 X{x0} Y{cy} F{f}
        G1 X{x1}
        G1 X{cx} Y{y0}
        G1 Y{y1}
        # 45° diagonals: each one runs only one belt over its full length
        G1 X{cx - d} Y{cy - d}
        G1 X{cx + d} Y{cy + d}
        G1 X{cx - d} Y{cy + d}
        G1 X{cx + d} Y{cy - d}
    {% endfor %}
    G1 X{cx} Y{cy} F{f}
    M400
    RESPOND MSG="AWD_SYNC done: XY motors are holding at the center. Tighten the front pulley grub screws now, then G28 and SYNC_MOTORS."
