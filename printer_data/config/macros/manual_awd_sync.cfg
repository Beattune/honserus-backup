# CoreXY AWD baseline for motors_sync.
# 1. Loosen the grub screws of the FRONT motor pulleys (stepper_x1, stepper_y1).
# 2. AWD_SYNC: re-applies the last motors_sync phase offset, then lets every
#    motor settle a few times (motors off/on + small X and Y moves; on CoreXY
#    each of them turns both belts) and leaves all XY motors holding.
# 3. Tighten the front pulleys while the motors hold (idle_timeout: 30 min).
# 4. G28, then SYNC_MOTORS: it starts from this mechanical baseline and saves
#    the result as the offset restored after every boot.
# Do not power cycle or restart Klipper between 2. and 4.
[gcode_macro AWD_SYNC]
description: CoreXY AWD baseline. Loosen the FRONT motor pulleys first, tighten them when the macro is done, then G28 + SYNC_MOTORS
gcode:
    {% set iterations = params.ITERATIONS|default(4)|int %}
    {% set dist = params.DIST|default(0.4)|float %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("AWD_SYNC: not while a print is " ~ printer.print_stats.state) }
    {% endif %}
    M84
    # Phase relation of each motor pair = the one motors_sync restores after boot
    SYNC_MOTORS RESTORE_SYNC=1
    {% for i in range(iterations) %}
        # Fake XY position for the settle moves; Z stays unhomed and is never moved
        SET_KINEMATIC_POSITION X={printer.toolhead.axis_maximum.x / 2} Y={printer.toolhead.axis_maximum.y / 2} CLEAR=Z
        G91
        G1 X{dist} F600
        G1 X-{dist}
        G1 Y{dist}
        G1 Y-{dist}
        G90
        M400
        {% if i < iterations - 1 %}
            M84
            G4 P500
        {% endif %}
    {% endfor %}
    # Motors stay enabled, but nothing counts as homed anymore
    SET_KINEMATIC_POSITION CLEAR=XYZ
    RESPOND MSG="AWD_SYNC done: XY motors are holding. Tighten the front pulley grub screws now, then G28 and SYNC_MOTORS."
