#####################################################################
#   Caselight idle shutoff
#####################################################################
# Scheduled by [idle_timeout] gcode. Only switches off if the printer
# is still idle - any activity in between moves state to Ready/Printing.
[delayed_gcode _CASELIGHT_IDLE_OFF]
gcode:
  {% if printer.idle_timeout.state == "Idle" %}
    SET_PIN PIN=caselight VALUE=0
  {% endif %}

[gcode_macro CASELIGHT_ON]
description: Turn the caselight back on
gcode:
  SET_PIN PIN=caselight VALUE=1
