[belt_tension]
lower_steppers: stepper_x, stepper_x1   # Motors of the lower belt (verified by STEPPER_BUZZ 2026-11-22)
upper_steppers: stepper_y, stepper_y1   # Motors of the upper belt
accel_chip: adxl345 carto               # Toolhead accelerometer, full section name
accel_axis: y                           # Accelerometer axis along printer Y (axes_map already printer frame)
belt_type: gates_gt2_epdm               # gates_gt2_rf, gates_gt2_epdm, gates_gt3 or rubber_aramid
belt_width: 10                          # Nominal belt width in mm: 6, 9, 10, 12
custom_linear_mass: False               # True uses linear_mass instead of belt_type and belt_width
#linear_mass:                           # Belt linear mass in g/m, used when custom_linear_mass is True
diag: False                             # True prints diagnostics with every reading
motors_off_when_uneven: True            # Uneven belts: XY motors off after the result, ready to adjust
#keep_archives: 2                       # Log archives kept in belt_tension/logs

[gcode_macro BELT_TENSION]
description: Read the tension of both XY belts
rename_existing: _BELT_TENSION_RUN
gcode:
    _BELT_TENSION_RUN {rawparams}

[gcode_macro BELT_TENSION_LOGS]
description: Pack the newest belt tension runs into one file to send
rename_existing: _BELT_TENSION_LOGS_RUN
gcode:
    _BELT_TENSION_LOGS_RUN {rawparams}
