# Managed by the accelerometer homing installer. Edit this file normally.
# Independent overrides; leave commented to use SAVE_CONFIG calibration models.
[accel_homing]
accel_chip: adxl345 carto
#x_threshold: 8.0
# Manual Y fallback if the saved selected-axis model ever misbehaves:
#y_threshold: 1.9
# TEMPORARY (front-homing test): lets Klipper start until Y is recalibrated. REMOVE after calibration is saved.
y_threshold: 3.0
# Only needed again if the motor-enable snap after M84 trips Y homing:
enable_settle_time: 1.0
# Y back-off keeps the toolhead cable clear while X homes
y_back_off_dist: 50
#model: default
