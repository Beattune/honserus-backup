# Managed by the accelerometer homing installer. Edit this file normally.
# Independent overrides; leave commented to use SAVE_CONFIG calibration models.
[accel_homing]
accel_chip: adxl345 carto
#x_threshold: 8.0
# Manual Y fallback if the saved selected-axis model ever misbehaves:
#y_threshold: 1.9
# Only needed again if the motor-enable snap after M84 trips Y homing:
#enable_settle_time: 1.0
# Let the frame stop ringing after the left impact before the wizard's positive search (default 0.25 false-triggered)
calibration_settle_time: 1.0
# TEMPORARY (wizard alpha test): low accel removes the -Y start-of-move kick (1.9 g at 5000). REMOVE after ACCEL_HOMING_TRAVEL Y is saved.
homing_accel: 1000
x_threshold: 4.0
y_threshold: 1.5
# Y back-off keeps the toolhead cable clear while X homes
y_back_off_dist: 50
#model: default
