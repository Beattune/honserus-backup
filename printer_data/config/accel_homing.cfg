# Managed by the accelerometer homing installer. Edit this file normally.
# Independent overrides; leave commented to use SAVE_CONFIG calibration models.
[accel_homing]
accel_chip: adxl345 carto
#x_threshold: 8.0
# TEST 2026-11-09: explicit threshold = selected-axis Y detector (not XYZ magnitude)
y_threshold: 1.9
# motor-enable snap after M84 rings >0.4 s; default 0.25 s let it leak into the reference (2026-11-09)
enable_settle_time: 1.0
y_back_off_dist: 50
#model: default
